[project]
name = "fire-sim-backend"
version = "0.1.0"
description = "Forest fire PDE simulator: solver and API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "scipy>=1.18.1",
]
