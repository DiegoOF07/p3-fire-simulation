# Template: copy it, rename `name` and the file. A list in [scene] or [params]
# is a sweep; every combination of lists becomes one run.
name = "ejemplo"
question = "¿Cómo cambia la velocidad del frente con la difusividad κ?"

[scene]
preset = "flat"
density = 1.5
seed = [0, 1]

[params]
kappa = [0.25, 0.5, 1.0]

[run]
ignite = [[100, 100]]  # m, one or more points
max_time = 120         # simulated seconds
speed = 5              # 1, 5 or 20: solver steps per recorded row
