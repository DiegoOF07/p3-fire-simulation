<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Sim</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
      #app { width: 100%; height: 100%; }
      #status { position: fixed; left: 12px; bottom: 12px; font-size: 13px; color: #c3c2b7; }
      .metrics-panel {
        position: fixed; top: 12px; right: 12px; padding: 12px 12px 4px;
        display: flex; flex-direction: column; gap: 12px;
        background: #1a1a19; border-radius: 8px; color: #c3c2b7; font-size: 12px;
      }
      .metric-head { display: flex; align-items: center; gap: 8px; margin: 0 4px 4px; }
      .metric-key { width: 12px; height: 2px; border-radius: 1px; }
      .metric-title { font-size: 13px; font-weight: 600; color: #f0efec; }
      .metric-value { margin-left: auto; font-variant-numeric: tabular-nums; color: #f0efec; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="metrics"></div>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
